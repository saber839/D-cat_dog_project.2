<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园猫狗识别系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="container">
            <h1>🐱 校园猫狗识别系统 🐶</h1>
            <p class="subtitle">基于深度学习的猫狗图像分类 · PyTorch · Grad-CAM可解释性</p>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container">
        <!-- 上传区域 -->
        <section class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📁</div>
                <p class="upload-text">拖拽图片到此处 或 点击上传</p>
                <p class="upload-hint">支持 JPG、PNG、BMP 格式，单张或多张均可</p>
                <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.bmp" multiple hidden>
                <button class="btn btn-primary" id="uploadBtn">
                    选择图片
                </button>
            </div>

            <!-- 图片预览 -->
            <div class="preview-section" id="previewSection" style="display: none;">
                <h3>已选择 <span id="fileCount">0</span> 张图片</h3>
                <div class="preview-grid" id="previewGrid"></div>
                <div class="action-buttons">
                    <button class="btn btn-primary" id="analyzeBtn">
                        🔍 开始识别
                    </button>
                    <button class="btn btn-secondary" id="clearBtn">
                        🗑️ 清空重选
                    </button>
                </div>
            </div>
        </section>

        <!-- 加载状态 -->
        <section class="loading-section" id="loadingSection" style="display: none;">
            <div class="loading-spinner"></div>
            <p>正在分析中，请稍候...</p>
        </section>

        <!-- 结果展示 -->
        <section class="result-section" id="resultSection" style="display: none;">
            <h2>📊 识别结果</h2>
            <div class="result-grid" id="resultGrid"></div>
        </section>

        <!-- 示例图片 -->
        <section class="demo-section">
            <h2>📷 试试示例图片</h2>
            <div class="demo-grid">
                <div class="demo-card" data-src="demo_cat.jpg">
                    <div class="demo-placeholder">🐱</div>
                    <p>示例猫咪</p>
                </div>
                <div class="demo-card" data-src="demo_dog.jpg">
                    <div class="demo-placeholder">🐶</div>
                    <p>示例狗狗</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 结果详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <div class="container">
            <p>技术栈：Python · PyTorch · Flask · Grad-CAM | 校园猫狗图像分类实战</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
